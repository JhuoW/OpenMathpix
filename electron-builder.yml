appId: com.openmathpix.app
productName: OpenMathpix
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - THIRD_PARTY_NOTICES.md
asarUnpack:
  - node_modules/onnxruntime-node/bin/**/*
  - node_modules/@img/**/*
  - node_modules/sharp/**/*
afterPack: scripts/after-pack.cjs
extraResources:
  - from: build/icon.png
    to: icon.png
linux:
  target:
    - AppImage
    - deb
  category: Utility
mac:
  target:
    - dmg
    - zip
  category: public.app-category.utilities
win:
  icon: build/icon.ico
  target:
    - nsis
    - portable
