<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      body {
        cursor: crosshair;
        user-select: none;
      }
      canvas {
        display: block;
        position: absolute;
        top: 0;
        left: 0;
        touch-action: none;
      }
      #instruction {
        position: fixed;
        top: 24px;
        left: 50%;
        transform: translateX(-50%);
        max-width: calc(100% - 32px);
        padding: 8px 12px;
        background: rgba(0, 0, 0, 0.75);
        color: #fff;
        font: 14px/1.4 sans-serif;
        border-radius: 6px;
        pointer-events: none;
        z-index: 10;
      }
      #dimensions {
        position: fixed;
        padding: 2px 6px;
        background: rgba(0, 0, 0, 0.7);
        color: #fff;
        font: 12px/1.4 monospace;
        border-radius: 3px;
        pointer-events: none;
        display: none;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="instruction">Drag to select a region. Press Esc to cancel.</div>
    <div id="dimensions"></div>
    <script type="module" src="./overlay.ts"></script>
  </body>
</html>
