<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      :root {
        --card: #ffffff;
        --border: rgba(15, 23, 42, 0.1);
        --title: #111827;
        --body: #4b5563;
        --hint: #9ca3af;
        --error: #dc2626;
        --hover: #f8fafc;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --card: #1f2937;
          --border: rgba(255, 255, 255, 0.12);
          --title: #f9fafb;
          --body: #d1d5db;
          --hint: #9ca3af;
          --error: #f87171;
          --hover: #273244;
        }
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        user-select: none;
      }
      #card {
        position: absolute;
        inset: 8px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 10px 0 14px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--card);
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
        cursor: pointer;
        opacity: 0;
        transform: translateY(8px);
        transition:
          opacity 160ms ease-out,
          transform 160ms ease-out,
          background 120ms;
      }
      #card.visible {
        opacity: 1;
        transform: none;
      }
      #card:hover {
        background: var(--hover);
      }
      #logo {
        width: 32px;
        height: 32px;
        flex: none;
      }
      #text {
        min-width: 0;
        flex: 1;
      }
      #title {
        font-size: 13px;
        font-weight: 600;
        color: var(--title);
      }
      #card[data-kind='error'] #title {
        color: var(--error);
      }
      #body {
        margin-top: 2px;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        font:
          12px/1.4 ui-monospace,
          Consolas,
          monospace;
        color: var(--body);
      }
      #card[data-kind='error'] #body,
      #card[data-kind='info'] #body {
        white-space: normal;
        font-family: inherit;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }
      #hint {
        margin-top: 2px;
        font-size: 11px;
        color: var(--hint);
      }
      #close {
        align-self: flex-start;
        margin-top: 8px;
        width: 22px;
        height: 22px;
        border: 0;
        border-radius: 5px;
        background: transparent;
        color: var(--hint);
        font-size: 16px;
        line-height: 22px;
        cursor: pointer;
      }
      #close:hover {
        background: var(--border);
        color: var(--title);
      }
    </style>
  </head>
  <body>
    <div id="card" role="status" aria-live="polite">
      <img id="logo" alt="" />
      <div id="text">
        <div id="title"></div>
        <div id="body"></div>
        <div id="hint"></div>
      </div>
      <button id="close" type="button">×</button>
    </div>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
